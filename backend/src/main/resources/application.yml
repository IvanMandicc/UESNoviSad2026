# Podrazumevana podesavanja. Prave vrednosti (lozinka baze, JWT tajna) drze se
# u application-local.yml koji NE ide u git, ili u promenljivama okruzenja.
spring:
  application:
    name: novisad

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uesnovisad}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # U razvoju je 'update' dovoljan; za predaju preci na 'validate' + migracije.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  jackson:
    default-property-inclusion: non_null

  # [UES] Elasticsearch za indeksiranje i pretragu mesta.
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:40MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Mora biti najmanje 32 karaktera (HMAC-SHA256).
    secret: ${JWT_SECRET:promeni-ovaj-tajni-kljuc-u-produkciji-min-32-karaktera}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    issuer: novisad-app

  # [K1] Predefinisan administrator sistema.
  admin:
    email: ${ADMIN_EMAIL:admin@novisad.rs}
    password: ${ADMIN_PASSWORD:Admin123!}
    first-name: ${ADMIN_FIRST_NAME:Administrator}
    last-name: ${ADMIN_LAST_NAME:Sistema}

  # [UES] Indeksiranje mesta u Elasticsearch. Iskljuceno u testovima.
  search:
    enabled: ${SEARCH_ENABLED:true}

  # [K3]/[UES] Skladiste slika i dokumenata.
  # 'local' pise na fajl sistem, 'minio' u MinIO bazu (UES deo).
  storage:
    type: ${STORAGE_TYPE:minio}
    location: ${STORAGE_LOCATION:uploads}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:novisad}
      secret-key: ${MINIO_SECRET_KEY:novisad123}
      bucket: ${MINIO_BUCKET:novisad}

  # [A1]/[K9] Slanje mejlova. Dok je enabled = false, poruke se samo beleze u log.
  # Za stvarno slanje: enabled = true + spring.mail.* podaci (host, port, username,
  # password), npr. Gmail SMTP sa app lozinkom.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@novisad.rs}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    rs.ftn.uns.novisad: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/novisad.log}
