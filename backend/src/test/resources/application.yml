# Testovi se izvrsavaju nad in-memory H2 bazom, tako da za `mvnw test`
# nije potrebna pokrenuta PostgreSQL instanca.
spring:
  datasource:
    url: jdbc:h2:mem:novisad-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: test-tajni-kljuc-za-testove-minimum-32-karaktera
    expiration-seconds: 3600
    issuer: novisad-app
  admin:
    email: admin@test.rs
    password: Admin123!
    first-name: Test
    last-name: Admin
  storage:
    type: local
    location: target/test-uploads

  cors:
    allowed-origins: http://localhost:4200

logging:
  file:
    name: target/test-logs/novisad-test.log
