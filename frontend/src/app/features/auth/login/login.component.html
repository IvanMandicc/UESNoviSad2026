<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Prijava</h1>
    <p class="subtitle">Prijavite se svojim nalogom da biste nastavili.</p>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">{{ errorMessage() }}</div>
    }

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="ime@primer.rs" />
      @if (hasError('email')) {
        <small class="error">Unesite ispravnu email adresu.</small>
      }
    </label>

    <label class="field">
      <span>Lozinka</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (hasError('password')) {
        <small class="error">Lozinka je obavezna.</small>
      }
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Prijavljivanje...' : 'Prijavi se' }}
    </button>

    <p class="foot">
      Nemate nalog? <a routerLink="/registracija">Pošaljite zahtev za registraciju</a>
    </p>
  </form>
</div>
